[package]
name = "antigravity-gate"
version = "0.1.0"
edition = "2021"
description = "High-performance smart-proxy gateway and IDE patcher for developer AI tools"
license = "MIT"
readme = "README.md"
keywords = ["proxy", "antigravity", "gemini", "cursor", "socks5"]
categories = ["network-programming", "command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
