name: CI & Multi-Platform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test

  release:
    name: Build Release Binary (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: antigravity-gate.exe
            asset_name: antigravity-gate-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: antigravity-gate
            asset_name: antigravity-gate-linux-x64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: antigravity-gate
            asset_name: antigravity-gate-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: "--remap-path-prefix ${{ github.workspace }}=/build --remap-path-prefix ${{ runner.temp }}=/tmp"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Package asset (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.bin_name }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
